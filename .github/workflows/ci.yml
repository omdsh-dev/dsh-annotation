name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - name: Resolve latest DSH tag
        id: host
        run: echo "ref=$(node scripts/resolve-dsh-tag.mjs)" >> "$GITHUB_OUTPUT"

      - name: Clone latest DSH host
        run: |
          DSH_ROOT="$GITHUB_WORKSPACE/../../.dsh/source/current"
          mkdir -p "$(dirname "$DSH_ROOT")"
          git clone --depth 1 --branch "${{ steps.host.outputs.ref }}" https://github.com/deepseek-ai/deepseek-harness.git "$DSH_ROOT"
          echo "Resolved DSH host ${{ steps.host.outputs.ref }}"

      - name: Install and build DSH host
        working-directory: ${{ github.workspace }}/../../.dsh/source/current
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Browser annotation interactions
        run: |
          git fetch --depth 1 origin tag v1.4.10
          git show v1.4.10:client.js > /tmp/annotation-1.4.10-client.js
          BASELINE_CLIENT=/tmp/annotation-1.4.10-client.js node test/header-scroll-browser.mjs
          node test/panel-background-browser.mjs
          node test/overlay-browser.mjs
          node test/window-drag-browser.mjs
          node test/pending-chip-browser.mjs
          node test/sidebar-browser.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/../../.dsh/source/current/apps/web/node_modules/playwright/index.mjs

      - name: Verify plugin package
        id: pack
        run: node scripts/verify-pack.mjs

      - name: Smoke real DSH Web
        run: node scripts/e2e.mjs --install tarball --tarball "${{ steps.pack.outputs.tarball }}" --tarball-sha256 "${{ steps.pack.outputs.sha256 }}" --port 3190 --sidebar
        env:
          DSH_ROOT: ${{ github.workspace }}/../../.dsh/source/current
          DSH_BIN: ${{ github.workspace }}/../../.dsh/source/current/apps/cli/lib/bin.js

  enter:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: historical
            host_tag: dsh-v0.1.5-rc.2
            host_sha: fb2c4b9e698e30edb738bca4cf0618587db7d203
          - variant: current
            host_tag: dsh-v0.2.0-rc.2
            host_sha: 639ed015397290b3745d163aafe02ffee4aa3f84
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENTER_ARTIFACTS: ${{ github.workspace }}/.artifacts/host-enter/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check out exact historical annotation release
        if: matrix.variant == 'historical'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: omdsh-dev/dsh-annotation
          ref: ed7b65746a006ca2ccb414566a8bad4b81040487
          path: .historical-annotation

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - name: Set runner-local DSH checkout path
        env:
          VARIANT: ${{ matrix.variant }}
        run: echo "DSH_ROOT=$RUNNER_TEMP/annotation-enter-$VARIANT" >> "$GITHUB_ENV"

      - name: Clone pinned DSH host
        env:
          HOST_TAG: ${{ matrix.host_tag }}
          HOST_SHA: ${{ matrix.host_sha }}
        run: |
          git clone --depth 1 --branch "$HOST_TAG" https://github.com/deepseek-ai/deepseek-harness.git "$DSH_ROOT"
          test "$(git -C "$DSH_ROOT" rev-parse HEAD)" = "$HOST_SHA"

      - name: Install and build pinned DSH host
        working-directory: ${{ env.DSH_ROOT }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Chromium for actual Web verification
        working-directory: ${{ env.DSH_ROOT }}/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the tested annotation package
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          PLUGIN_DIR="$GITHUB_WORKSPACE"
          if [ "$VARIANT" = historical ]; then PLUGIN_DIR="$GITHUB_WORKSPACE/.historical-annotation"; fi
          pnpm --dir "$PLUGIN_DIR" install --frozen-lockfile
          pnpm --dir "$PLUGIN_DIR" run build
          echo "ANNOTATION_PLUGIN_DIR=$PLUGIN_DIR" >> "$GITHUB_ENV"

      - name: Running Enter from browser through RPC and physical JSONL
        env:
          VARIANT: ${{ matrix.variant }}
        run: node scripts/run-host-enter.mjs --host "$DSH_ROOT" --plugin "$ANNOTATION_PLUGIN_DIR" --variant "$VARIANT" --artifacts "$ENTER_ARTIFACTS"

      - name: Build the IME guard package for the historical host
        if: matrix.variant == 'historical'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Reproduce the historical IME omission through RPC and physical JSONL
        if: matrix.variant == 'historical'
        env:
          VARIANT: ${{ matrix.variant }}
        run: node scripts/run-host-enter.mjs --host "$DSH_ROOT" --plugin "$ANNOTATION_PLUGIN_DIR" --variant "$VARIANT" --scenario ime-baseline --artifacts "$ENTER_ARTIFACTS/ime-baseline"

      - name: IME guard from Chromium events through RPC and physical JSONL
        env:
          VARIANT: ${{ matrix.variant }}
        run: node scripts/run-host-enter.mjs --host "$DSH_ROOT" --plugin "$GITHUB_WORKSPACE" --variant "$VARIANT" --scenario ime --artifacts "$ENTER_ARTIFACTS/ime"

      - name: Preserve Enter request and persistence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annotation-enter-${{ matrix.variant }}
          path: .artifacts/host-enter/${{ matrix.variant }}
          if-no-files-found: ignore
