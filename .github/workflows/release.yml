name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      # npm Trusted Publishing requires npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install --global 'npm@^11.5.1'

      - name: Verify release version
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::release tag ($RELEASE_TAG) does not match package.json version (v$VERSION)"
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            # Never move the public `latest` dist-tag backwards: DSH Desktop
            # installs exact versions, so a re-created release must not be
            # allowed to silently downgrade them (issue #30).
            PUBLISHED="$(npm view @changfenhuang/dsh-annotation version 2>/dev/null || true)"
            if [ -n "$PUBLISHED" ]; then
              BELOW="$(node -e '
                const core = (s) => s.replace(/^v/, "").split("-")[0].split(".").map(Number);
                const below = (t, p) => {
                  for (let i = 0; i < Math.max(t.length, p.length); i++) {
                    if ((t[i] ?? 0) < (p[i] ?? 0)) return true;
                    if ((t[i] ?? 0) > (p[i] ?? 0)) return false;
                  }
                  return false;
                };
                console.log(below(core(process.argv[1]), core(process.argv[2])) ? "yes" : "no");
              ' "v$VERSION" "$PUBLISHED")"
              if [ "$BELOW" = "yes" ]; then
                echo "::error::refusing to publish v$VERSION below the already-published latest ($PUBLISHED)"
                exit 1
              fi
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}"
